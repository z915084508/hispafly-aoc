overrides:
  # Upstream packages pin vulnerable versions; keep overrides scoped to each parent.
  '@tailwindcss/postcss>postcss': 8.5.23
  '@vercel/cli-config>zod': 4.6.7
  # GHSA-ggr8-5vv4-36mx has no advisory-listed 7.x fix. Avoid a Prisma major upgrade.
  '@prisma/config>deepmerge-ts': 8.0.0

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
