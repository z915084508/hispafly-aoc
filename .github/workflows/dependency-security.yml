name: Dependency security regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://audit:audit@127.0.0.1:1/aoc_security_unreachable
      DIRECT_URL: postgresql://audit:audit@127.0.0.1:1/aoc_security_unreachable
      AOC_RUN_MIGRATIONS: "false"
      AOC_RUN_STAFF_BOOTSTRAP: "false"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level high
      - run: pnpm audit --prod --audit-level high
      - run: pnpm exec prisma validate && pnpm exec prisma generate
      - run: npm run test:build-safety
      - run: pnpm test:security-dependencies && pnpm test:identity && pnpm test:identity-email
      - run: pnpm test:native-pilot-booking && pnpm test:simbrief-ofp-v2 && pnpm test:simbrief-pdf && pnpm test:amn
