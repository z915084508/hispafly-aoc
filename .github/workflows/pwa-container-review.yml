name: PWA container artifact review (manual only)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed packaging commit
        required: true
        type: string
      confirm:
        description: Type BUILD_ISOLATED_ARTIFACT after separate authorization
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pwa-container-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate manual authorization inputs
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$CONFIRM" = BUILD_ISOLATED_ARTIFACT
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/pwa-container-artifact
        with:
          source_sha: ${{ inputs.source_sha }}
