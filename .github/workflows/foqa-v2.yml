name: FOQA v2 regression
on:
  push:
    branches: [feature/foqa-scoring-v2]
  pull_request:
  workflow_dispatch:
    inputs:
      run_isolated_database_validation:
        description: Run schema SQL and database tests only in an ephemeral test PostgreSQL service
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://audit:audit@127.0.0.1:1/aoc_ci_unreachable
      DIRECT_URL: postgresql://audit:audit@127.0.0.1:1/aoc_ci_unreachable
      CHECKPOINT_DISABLE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma validate
      - run: npm run test:build-safety
      - run: npm run test:pwa
      - name: Build without migrations, even with retired flags enabled
        env:
          AOC_RUN_MIGRATIONS: "true"
          AOC_RUN_STAFF_BOOTSTRAP: "true"
        run: npm run build
      - run: pnpm test:foqa && pnpm test:acars-completion && pnpm test:flight-analysis
      - run: pnpm exec tsc --noEmit
      - run: npm run lint

  isolated-database:
    name: Isolated database validation (manual only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_isolated_database_validation }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foqa
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/foqa
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/foqa
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma validate && pnpm exec prisma generate
      - name: Verify the fixed ephemeral database target
        shell: bash
        run: |
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@127.0.0.1:5432/foqa'
          test "$DIRECT_URL" = "$DATABASE_URL"
      # These historical-schema operations are intentionally manual, test-only,
      # and cannot be triggered by opening/updating a PR or by a normal push.
      - name: Validate v2 migration against isolated baseline schema
        run: |
          git show 8137288f82fe744b57edf867672ee40e6aab09f8:prisma/schema.prisma > /tmp/foqa-baseline.prisma
          pnpm exec prisma db push --schema /tmp/foqa-baseline.prisma --skip-generate
          pnpm exec prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20260827210000_foqa_scoring_v2/migration.sql
          pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: FOQA_TEST_DATABASE=1 node --experimental-strip-types src/lib/pirep/foqa-database.test.ts
