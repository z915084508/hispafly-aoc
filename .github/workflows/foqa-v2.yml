name: FOQA v2 regression
on:
  push:
    branches: [feature/foqa-scoring-v2]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foqa
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foqa
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/foqa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate && pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm test:foqa && pnpm test:acars-completion && pnpm test:flight-analysis
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec next build
